name: aimaru
description: 2人のスケジュール共有アプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.0.4

  # Google認証
  google_sign_in: ^6.2.1

  # Google Calendar API
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Gemini AI
  google_generative_ai: ^0.4.3

  # 状態管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # カレンダーUI
  table_calendar: ^3.0.9

  # 画像
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # その他UI
  go_router: ^13.0.1
  intl: ^0.19.0
  uuid: ^4.3.3
  share_plus: ^13.3.0

  # 招待QR・ディープリンク
  qr_flutter: ^4.1.0
  app_links: ^6.3.2

  # 設定の保存・画像の端末保存
  shared_preferences: ^2.3.2
  gal: ^2.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
