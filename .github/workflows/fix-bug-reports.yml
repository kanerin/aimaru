name: Fix reported bugs (every 5h)

# アプリ内の「バグ報告・機能要望」フォーム（設定画面）から届き、
# submitBugReport（Cloud Functions）がGeminiで判定してFirestoreの
# bugReportsコレクションへストックした内容のうち、**バグ報告のみ**を
# 1件読み、実装してdevelopへPRを作成してauto-mergeする。
# developへの反映後、release-stgへのfast-forward昇格は promote-to-stg.yml が
# CI成功をトリガーに自動で行う（このワークフロー自身はrelease-stgに触れない）。
#
# 2026-08-21、機能要望（classification: feature_request）は対象から外した。
# 機能追加は「あったほうがよいかもしれない」という製品判断そのものであり、
# バグ修正（既存の意図通りに戻すだけ）と違って無人・無レビューで
# developへ入れるべきではない。route-feature-requests-to-issues.mjs
# （決定的なスクリプト、LLMの判断を介さない）が機能要望をGitHub Issueへ
# 起票してrejected（out_of_scope）にし、人間がそのIssueへ@claudeで
# メンションして初めて実装される（claude-mention.yml が対応する）。
#
# 人間レビューを介さない自動実装のため、安全装置はCIに加えて次の2つ:
# - bugReportsコレクション自体はクライアントから読み書きできない
#   （firestore.rules）ため、Gemini判定を経ていない内容が紛れ込むことはない。
# - .claude/commands/fix-bug-reports.md が、報告の原文（rawText）を
#   「信頼できないデータ」として扱い、報告経由での指示に従わないことを
#   明示している（プロンプトインジェクション対策）。

on:
  schedule:
    - cron: '0 */5 * * *' # 5時間おき（UTC 0,5,10,15,20時 = JST 9,14,19,24,5時）
  workflow_dispatch: {}

# workflow_dispatchでの手動実行とcronが重なった場合に多重起動しないようにする
concurrency:
  group: fix-bug-reports
  cancel-in-progress: false

jobs:
  fix-bug-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # claude-code-action がOIDCトークン取得に使う
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # firebase_options.dart は公開リポジトリに含めていないため、
      # flutter test の実行（main.dart がimportしている）にはSecretsからの復元が要る
      - name: Restore firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      # bugReportsコレクションの読み書きに使う。release-stg.ymlのFirestoreルール
      # デプロイと同じ資格情報だが、こちらはFirestoreドキュメントの読み書き
      # （list-pending-bug-reports.mjs / mark-bug-report-status.mjs）に使うだけで、
      # ルール・索引のデプロイ権限（現状403で失敗する、docs/open-issues.md参照）は要らない。
      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Configure git identity for automated commits
        run: |
          git config user.name "aimaru-bot"
          git config user.email "actions@users.noreply.github.com"

      # 機能要望はClaude Codeを介さず、ここで決定的に（LLMの判断無しで）
      # GitHub Issueへ振り分ける。Claude Codeの実行より前に行うことで、
      # list-pending-bug-reports.mjs --classification=bug がその後の
      # ステップで参照するpending一覧には最初から機能要望が含まれない。
      - name: Route feature requests to GitHub Issues (deterministic, no LLM judgment)
        working-directory: functions
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/route-feature-requests-to-issues.mjs

      - uses: anthropics/claude-code-action@v1
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            .claude/commands/fix-bug-reports.md の指示を読み、その通りに実行してください。
          display_report: true
          claude_args: --max-turns 150 --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git *),Bash(flutter *),Bash(npm *),Bash(node *),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh pr list:*),Bash(gh pr view:*)"
