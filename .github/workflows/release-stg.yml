name: Distribute to testers (release-stg)

on:
  push:
    branches: [release-stg]
  workflow_dispatch: {}

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - run: npm install -g firebase-tools

      - name: Distribute to testers via Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" \
            --release-notes "$RELEASE_NOTES" \
            --testers "${{ secrets.APP_DISTRIBUTION_TESTERS }}" \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"
