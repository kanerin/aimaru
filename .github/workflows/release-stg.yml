name: Distribute to testers (release-stg)

# ci.yml は PR と develop だけが対象なので、release-stg へ直接pushすると
# analyze も test も走らないままテスターへ配布されてしまう。
# 配布物が壊れているほうが検査の数分より高くつくため、ビルドの前に検査する。

on:
  push:
    branches: [release-stg]
  workflow_dispatch:
    inputs:
      from_sha:
        description: 'リリースノートの起点コミット（省略時は前回配布地点のタグ stg-distributed を使う）'
        required: false
        default: ''

jobs:
  distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 配布した地点を stg-distributed タグに記録するため
    steps:
      - uses: actions/checkout@v5
        with:
          # リリースノートは「前回配布した地点からの差分」なので、
          # 全履歴とタグが要る（既定の浅いクローンでは差分が取れない）
          fetch-depth: 0

      # テスターの端末には「何が変わったのか」しか届かない。以前は
      # コミットメッセージ1行（自動昇格の場合は「昇格ビルド（sha）」だけ）を
      # 渡していたため、配布されたAPKに何が入っているのか誰にも分からなかった。
      #
      # 起点は「前回テスターに配布したコミット」を指す stg-distributed タグ。
      # 配布が成功したときだけタグを進めるので、途中で失敗した回の変更も
      # 次の配布ノートにまとめて載り、取りこぼしが出ない。
      - name: Build release notes
        env:
          # workflow_dispatch 起動（promote-to-stg.yml からの自動昇格）で渡される、
          # 昇格前の release-stg の位置。タグがまだ無い初回のための保険
          FROM_SHA: ${{ inputs.from_sha }}
          # push 起動のときにGitHubがくれる、push前のブランチの位置
          EVENT_BEFORE: ${{ github.event.before }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          SUBJECTS="$RUNNER_TEMP/subjects.txt"
          MAX_ENTRIES=40

          # 起点として使えるコミットかを確かめる。存在し、かつHEADの祖先である
          # ものだけを採用する（HEAD自身なら差分ゼロ＝「変更なし」として扱う）
          resolve_base() {
            local cand="${1:-}" sha
            [ -n "$cand" ] || return 1
            sha=$(git rev-parse -q --verify "${cand}^{commit}" 2>/dev/null) || return 1
            git merge-base --is-ancestor "$sha" HEAD || return 1
            printf '%s' "$sha"
          }

          # 直近のバージョンタグ。バージョン採番の起点であり、
          # stg-distributed が無い場合はリリースノートの起点にもなる
          LAST_VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 | sed 's/^v//')

          BASE=""
          for cand in "refs/tags/stg-distributed" "refs/tags/v$LAST_VERSION" "$FROM_SHA" "$EVENT_BEFORE"; do
            [ "$cand" != "refs/tags/v" ] || continue   # タグがまだ無い場合
            if BASE=$(resolve_base "$cand"); then
              echo "リリースノートの起点: $cand ($BASE)"
              break
            fi
            BASE=""
          done

          if [ -n "$BASE" ]; then
            git log --no-merges --reverse --format=%s "$BASE..HEAD" > "$SUBJECTS"
          else
            # 初回など、前回配布地点がどうしても分からないとき。黙って
            # 空にすると「変更なし」と誤読されるので、断り書きを添えて直近を出す
            echo "起点が特定できませんでした。直近のコミットを表示します" >&2
            git log --no-merges --reverse --format=%s -n 10 HEAD > "$SUBJECTS"
          fi

          TOTAL=$(wc -l < "$SUBJECTS")
          OMITTED=0
          if [ "$TOTAL" -gt "$MAX_ENTRIES" ]; then
            OMITTED=$((TOTAL - MAX_ENTRIES))
            tail -n "$MAX_ENTRIES" "$SUBJECTS" > "$SUBJECTS.tmp"
            mv "$SUBJECTS.tmp" "$SUBJECTS"
          fi

          # Conventional Commits のプレフィクスで種類ごとに束ねる。
          # 見出しの下に置くので、行頭の "feat:" 等は落として読みやすくする
          FEAT="$RUNNER_TEMP/feat.txt"; FIX="$RUNNER_TEMP/fix.txt"; OTHER="$RUNNER_TEMP/other.txt"
          : > "$FEAT"; : > "$FIX"; : > "$OTHER"
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            target="$OTHER"; label="$subject"
            case "$subject" in
              *:*)
                type=${subject%%:*}   # "feat(scope)!: xxx" → "feat(scope)!"
                type=${type%%(*}      # スコープを落とす
                type=${type%!}        # 破壊的変更の "!" を落とす
                case "$type" in
                  feat) target="$FEAT"; label=${subject#*:} ;;
                  fix) target="$FIX"; label=${subject#*:} ;;
                  chore|docs|refactor|test|ci|perf|build|style|revert)
                    label=${subject#*:} ;;
                esac
                ;;
            esac
            printf -- '- %s\n' "${label# }" >> "$target"
          done < "$SUBJECTS"

          # ---- バージョン採番 ----
          # ビルド番号だけを増やすと表示は「1.0.0 (31)」「1.0.0 (32)」となり、
          # 何世代目なのかも、機能追加なのか不具合修正なのかも読み取れない。
          # リリース済みバージョンの正は v* タグ（配布に成功した時だけ打つ）で、
          # pubspec.yaml の version はその出発点として扱う。メジャーを上げたい等、
          # 人が決めたい時は pubspec を書き換えればそちらが優先される。
          PUBSPEC_VERSION=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)

          bump() { # $1=x.y.z $2=major|minor|patch
            local ma mi pa
            IFS=. read -r ma mi pa <<< "$1"
            case "$2" in
              major) echo "$((ma + 1)).0.0" ;;
              minor) echo "${ma}.$((mi + 1)).0" ;;
              *)     echo "${ma}.${mi}.$((pa + 1))" ;;
            esac
          }

          # 上げ幅を測る区間は「前回のバージョンタグから」。リリースノートの
          # 区間（前回の配布地点から）とは普段は一致するが、タグが片方しか
          # 無い状況でも正しい幅を出せるように別々に解決する
          VER_BASE=""
          if [ -n "$LAST_VERSION" ]; then
            VER_BASE=$(resolve_base "refs/tags/v$LAST_VERSION") || VER_BASE="$BASE"
          fi

          # pubspec の方が新しければ人が手で上げたということ
          newest_version=$(printf '%s\n%s\n' "$PUBSPEC_VERSION" "$LAST_VERSION" | sort -V | tail -n 1)

          if [ -z "$LAST_VERSION" ]; then
            APP_VERSION="$PUBSPEC_VERSION"   # 初回はpubspecの値をそのまま最初のリリースとする
            REASON="初回リリース（pubspec.yaml の値）"
          elif [ "$PUBSPEC_VERSION" != "$LAST_VERSION" ] && [ "$newest_version" = "$PUBSPEC_VERSION" ]; then
            APP_VERSION="$PUBSPEC_VERSION"
            REASON="pubspec.yaml で手動指定"
          elif [ -n "$VER_BASE" ] && [ "$(git rev-list --no-merges --count "$VER_BASE..HEAD")" -eq 0 ]; then
            APP_VERSION="$LAST_VERSION"      # 変更なしの再ビルド。ビルド番号だけ進める
            REASON="変更が無いため据え置き"
          else
            # feat があれば機能追加としてマイナー、破壊的変更ならメジャー、
            # それ以外（fix / chore など）はパッチ
            KIND=patch
            if [ -n "$VER_BASE" ]; then
              if git log --format=%s "$VER_BASE..HEAD" | grep -qE '^feat(\(.+\))?!?:'; then
                KIND=minor
              fi
              if git log --format=%B "$VER_BASE..HEAD" | grep -qE '^BREAKING[ -]CHANGE|^[a-z]+(\(.+\))?!:'; then
                KIND=major
              fi
            fi
            APP_VERSION=$(bump "$LAST_VERSION" "$KIND")
            REASON="$LAST_VERSION から $KIND 更新"
          fi
          echo "バージョン: $APP_VERSION ($REASON) / ビルド番号: $BUILD_NUMBER"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          {
            printf '%s\n\n' "${APP_VERSION:-?}"
            [ -n "$BASE" ] || printf '（前回の配布地点が特定できないため、直近の変更を表示しています）\n\n'
          } > "$NOTES_FILE"

          append_section() {
            if [ -s "$2" ]; then
              printf '%s\n' "$1" >> "$NOTES_FILE"
              cat "$2" >> "$NOTES_FILE"
              printf '\n' >> "$NOTES_FILE"
            fi
          }
          append_section "■ 新機能" "$FEAT"
          append_section "■ 修正" "$FIX"
          append_section "■ その他" "$OTHER"

          if [ "$TOTAL" -eq 0 ]; then
            printf '前回の配布からコード変更はありません（再ビルドのみ）。\n\n' >> "$NOTES_FILE"
          fi
          if [ "$OMITTED" -gt 0 ]; then
            printf 'ほか %s 件の変更\n\n' "$OMITTED" >> "$NOTES_FILE"
          fi

          printf 'commit %s\n' "$(git rev-parse --short HEAD)" >> "$NOTES_FILE"

          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

          # 配布前でも実行ページで中身を確認できるようにしておく
          {
            echo '## テスターに配布するリリースノート'
            echo '```'
            cat "$NOTES_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - run: flutter pub get

      # firebase_options.dart / google-services.json は公開リポジトリに含めず
      # Secrets から復元する（下記「Firebase設定ファイルの非公開化」参照）
      - name: Restore Firebase config files
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      # 検査は署名鍵を展開する前・APKを組む前に置く。壊れているときに
      # 6分かけてビルドしてから落ちるより早く分かり、鍵にも触らずに済む。
      - name: Analyze
        run: flutter analyze

      # 単体・ウィジェットテスト。結合テスト(integration_test/)は実機が要るため
      # ここでは走らせない。
      - name: Test
        run: flutter test

      # セキュリティルールはアプリを経由しない直接アクセスに対する最後の砦。
      # 配布物そのものには含まれないが、ルールが緩んだ状態でテスターに
      # 配ると、その端末から実データを触られる余地が残る。
      - name: Test security rules
        working-directory: rules_test
        run: npm ci && npm test

      # 通知はCloud Functions側で動くので、APKだけ緑でも壊れていることがある
      - name: Test Cloud Functions
        working-directory: functions
        run: npm ci && npm run typecheck && npm test && npm run test:integration

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - run: npm install -g firebase-tools

      # firestore.rules はリポジトリでは正だが、ここまでは
      # rules_test（エミュレータ）で検証しているだけで本番Firestoreには
      # 反映されない。以前はこのデプロイ手順が無く、firestore.rulesに
      # 追加したコレクション（例: todos）が本番では権限エラーになり、
      # アプリ側が無限ローディングのまま固まる不具合が実際に発生した。
      # テストを通過した内容だけを、ビルドの前にここでデプロイする。
      #
      # continue-on-error: FIREBASE_SERVICE_ACCOUNT_KEY のサービスアカウントに
      # Firestoreルールのデプロイ権限（serviceusage等）がまだ付与されておらず、
      # 現状は403で失敗する（IAM設定は後日人間が対応）。ここを必須にすると
      # 権限が直るまでテスター配布そのものが止まってしまうため、失敗しても
      # ビルド・配布は続行する。ルールは当面ローカルから手動デプロイすること。
      - name: Deploy Firestore rules
        id: deploy_rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy --only firestore:rules \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive

      # continue-on-error のままだと、ルールのデプロイに失敗してもジョブは緑になり
      # 誰も気づけない。実際にこれで expenses（割り勘）のルールが本番へ反映されず、
      # 画面を開くと権限エラーになる不具合が配信された（todos_screenに続いて2度目）。
      # 配信自体は止めないが、失敗したことは必ず目に見える形で残す。
      - name: Warn if Firestore rules were not deployed
        if: steps.deploy_rules.outcome != 'success'
        run: |
          echo "::warning title=Firestoreルール未デプロイ::firestore.rules を本番へ反映できませんでした。新しいコレクションを追加している場合、その画面は本番で権限エラーになります。"
          {
            echo "### ⚠️ Firestoreルールが本番へ反映されていません"
            echo ""
            echo "\`firebase deploy --only firestore:rules\` が失敗しました。"
            echo "サービスアカウントにGCP側のIAMロールが付与されていないためです。"
            echo ""
            echo "**新しいコレクションを追加した変更では、その画面が本番で権限エラーになります。**"
            echo "ローカルから手動で反映してください:"
            echo ""
            echo '```'
            echo "firebase deploy --only firestore:rules --project aimaru-7eb2e"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # firestore.indexes.json も rules と同じ理由（サービスアカウントに
      # 権限が無い）で自動デプロイできていない。索引が要るクエリに変更した
      # 場合、エミュレータでは通っても本番ではFAILED_PRECONDITIONで失敗する
      # （docs/open-issues.md 課題8）。IAMロールが揃うまでは
      # continue-on-error のまま、失敗を可視化するだけに留める。
      - name: Deploy Firestore indexes
        id: deploy_indexes
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy --only firestore:indexes \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive

      - name: Warn if Firestore indexes were not deployed
        if: steps.deploy_indexes.outcome != 'success'
        run: |
          echo "::warning title=Firestore索引未デプロイ::firestore.indexes.json を本番へ反映できませんでした。索引が要る新しいクエリは本番でFAILED_PRECONDITIONになります。"
          {
            echo "### ⚠️ Firestore索引が本番へ反映されていません"
            echo ""
            echo "\`firebase deploy --only firestore:indexes\` が失敗しました。"
            echo "サービスアカウントにGCP側のIAMロールが付与されていないためです（rulesと同じ原因）。"
            echo ""
            echo "**索引を追加するクエリ変更は、本番でFAILED_PRECONDITIONになります。**"
            echo "ローカルから手動で反映してください:"
            echo ""
            echo '```'
            echo "firebase deploy --only firestore:indexes --project aimaru-7eb2e"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # ビルド番号をCI実行ごとに一意にする。固定のままだとFirebase側で
      # 「同じリリースの上書き」と判定され、テスターに通知が飛ばない。
      # バージョン名(--build-name)は上のステップで採番した値で上書きする。
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number=${{ github.run_number }} \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # ノートは複数行になるため --release-notes（1行想定）ではなくファイルで渡す
      - name: Distribute to testers via Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" \
            --release-notes-file "$RELEASE_NOTES_FILE" \
            --testers "${{ secrets.APP_DISTRIBUTION_TESTERS }}" \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"

      # ここまで来た＝テスターの手元に届いた、という地点だけを記録する。
      # stg-distributed は次回のリリースノートの起点、v* は次回のバージョン
      # 採番の起点。配布に失敗した回はどちらも進まないので、その変更は
      # 次回にそのまま引き継がれる。
      - name: Record distributed commit
        run: |
          git tag -f stg-distributed "$GITHUB_SHA"
          git tag -f "v$APP_VERSION" "$GITHUB_SHA"
          git push -f origin refs/tags/stg-distributed "refs/tags/v$APP_VERSION"
