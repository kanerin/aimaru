name: Distribute to testers (release-stg)

# ci.yml は PR と develop だけが対象なので、release-stg へ直接pushすると
# analyze も test も走らないままテスターへ配布されてしまう。
# 配布物が壊れているほうが検査の数分より高くつくため、ビルドの前に検査する。

on:
  push:
    branches: [release-stg]
  workflow_dispatch: {}

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - run: flutter pub get

      # firebase_options.dart / google-services.json は公開リポジトリに含めず
      # Secrets から復元する（下記「Firebase設定ファイルの非公開化」参照）
      - name: Restore Firebase config files
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      # 検査は署名鍵を展開する前・APKを組む前に置く。壊れているときに
      # 6分かけてビルドしてから落ちるより早く分かり、鍵にも触らずに済む。
      - name: Analyze
        run: flutter analyze

      # 単体・ウィジェットテスト。結合テスト(integration_test/)は実機が要るため
      # ここでは走らせない。
      - name: Test
        run: flutter test

      # セキュリティルールはアプリを経由しない直接アクセスに対する最後の砦。
      # 配布物そのものには含まれないが、ルールが緩んだ状態でテスターに
      # 配ると、その端末から実データを触られる余地が残る。
      - name: Test security rules
        working-directory: rules_test
        run: npm ci && npm test

      # 通知はCloud Functions側で動くので、APKだけ緑でも壊れていることがある
      - name: Test Cloud Functions
        working-directory: functions
        run: npm ci && npm run typecheck && npm test && npm run test:integration

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # ビルド番号をCI実行ごとに一意にする。固定のままだとFirebase側で
      # 「同じリリースの上書き」と判定され、テスターに通知が飛ばない。
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - run: npm install -g firebase-tools

      - name: Distribute to testers via Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          # push起動（人間が直接pushした場合）はコミットメッセージを、
          # workflow_dispatch起動（promote-to-stg.ymlからの自動昇格を含む）は
          # head_commitが無いのでフォールバック文言を使う
          RELEASE_NOTES: ${{ github.event.head_commit.message || format('release-stg 昇格ビルド（{0}）', github.sha) }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" \
            --release-notes "$RELEASE_NOTES" \
            --testers "${{ secrets.APP_DISTRIBUTION_TESTERS }}" \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"
