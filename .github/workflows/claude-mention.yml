name: Claude mention

# Issue/PRのコメントで @claude とメンションされたら起動する。
# 良い提案Issue（propose-feature や test-report が起票したもの、あるいは
# 人間が書いたIssue）を、書き込み権限者が明示的に選んで実装させる運用。
#
# セキュリティ: claude-code-action は @mention トリガーに対して
# デフォルトでリポジトリへの書き込み権限を持つユーザーのみ起動を許可する
# （allowed_non_write_users を設定しない限りこの制限が有効）。
# 4つのワークフローの中で最も権限が広い（contents/pull-requests/issues すべてwrite）ため、
# この既定の制限を意図的に外さないこと。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# 同じIssue/PRスレッドへの連投で多重起動しないようにする。
# 新しいコメントが来たら古い方は打ち切ってよい（同一スレッドの処理なので）。
concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # コメント本文に "@claude" という文字列が単語境界付きで含まれるかを判定するだけの
  # 軽量ジョブ。「@claude-code」のような部分一致や、過去ログの引用に "@claude" という
  # 語が混ざっているだけのケースで、書き込み権限つきの本体ジョブまで起動しないようにする。
  # 本文はshellへ直接展開せず環境変数経由で渡し、コメント内容によるコマンドインジェクションを防ぐ。
  check:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      is_mention: ${{ steps.check.outputs.is_mention }}
    steps:
      - name: Check for an actual @claude mention
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if printf '%s' "$COMMENT_BODY" | grep -qP '(^|[^A-Za-z0-9_])@claude([^A-Za-z0-9_-]|$)'; then
            echo "is_mention=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_mention=false" >> "$GITHUB_OUTPUT"
          fi

  claude:
    needs: check
    if: needs.check.outputs.is_mention == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # claude-code-action がOIDCトークン取得に使う
    steps:
      - uses: actions/checkout@v5

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
