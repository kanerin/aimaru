name: CI

# 変更が既存の挙動を壊していないことを機械的に確かめるためのワークフロー。
# AIエージェントによる自律開発は「壊れたことに気づける仕組み」が前提になるため、
# このワークフローをPRの必須チェックに設定すること
# （Settings → Branches → develop → Require status checks to pass）。
#
# ジョブを分けているのは、落ちた場所から原因が一目で分かるようにするため。
# 1本にまとめると「CIが赤い」しか分からず、切り分けに時間を取られる。
#
# 結合テスト(e2e)を別ワークフローに切り出していないのは、promote-to-stg.yml が
# 「CIワークフローの成功」だけを条件にrelease-stgへ自動昇格するため。
# 別ワークフローにすると結合テストが赤いままテスターへ配信されてしまう。
#
# 2026-08-21、品質保証の見直しで3点追加した。無人の自動化エージェントが
# 多数コミットする運用のため、誤ってAPIキー等をコミットした場合に検知する層が
# 要るという判断:
# - secretsジョブ（gitleaksによるシークレット漏洩チェック）
# - functions/rulesジョブに npm audit（devDependencies除外・high/critical限定。
#   moderate以下も2026-08-22にoverridesでuuidを固定して解消済み。詳細は
#   functionsジョブの同名ステップのコメントを参照）
# - flutterジョブに dart format チェック（既存コードの大部分が標準スタイルに
#   沿っておらず、一括整形はlintを新たに発生させることが分かったため
#   `continue-on-error: true` で可視化のみに留めている。詳細はdocs/open-issues.md）

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  # 同じブランチへ連続でpushしたとき、古い実行を止めて最新だけを走らせる
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 無人の自動化エージェントが多数コミットする運用のため、誤って
      # APIキー・秘密鍵等をコミットした場合に検知する層。公開リポジトリの
      # ためgitleaks-actionはライセンス不要で使える。
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter:
    name: Flutter (analyze & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - run: flutter pub get

      # firebase_options.dart は公開リポジトリに含めず Secrets から復元する（下記「Firebase設定ファイルの非公開化」参照）
      - name: Restore firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Analyze
        run: flutter analyze

      # 2026-08-21時点で既存コードの大部分がdart formatの標準スタイルに
      # 沿っていない（値を縦に揃える手書きの独自整形が使われている箇所が多い）。
      # 一括で機械整形をかけると、if文の中かっこが外れてlintが新たに
      # 発生するケースが見つかった（例: lib/screens/calendar_screen.dart）ため、
      # 挙動を変えずに一括修正するには個別の見直しが要る。それまではblockingに
      # せず、フォーマット崩れを可視化するだけに留める。
      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      # 単体・ウィジェットテスト。結合テスト(integration_test/)は実機が要るため
      # ここでは走らせない。
      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  functions:
    name: Cloud Functions (typecheck, unit & integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Firestore エミュレータは JVM 上で動く
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # devDependencies（firebase-tools等、本番へは含まれないツール類）を
      # 除外した上で、high/critical のみを対象にする。
      # 2026-08-21〜22: moderate（firebase-admin配下のgaxios/teeny-request
      # が内部で使うuuid、GHSA-w5hq-g745-h8pq）はfirebase-adminをどこまで
      # 更新しても解消しないと判明した（Google自身の@google-cloud/storage
      # 側のuuidピン止めが原因で、firebase-admin@14.3.0=最新でも変わらない）。
      # firebase-admin/firebase-functionsのメジャー更新はリスクの割に
      # この件を解消しないため見送り、package.jsonのoverridesでuuidだけを
      # 安全なバージョンへ強制することで解消した（`npm audit --omit=dev`は
      # 0件）。
      - name: Dependency audit (high/critical only)
        run: npm audit --omit=dev --audit-level=high

      # テストコードも含めて型を通す（デプロイ成果物からは除外される）
      - name: Typecheck
        run: npm run typecheck

      # 判定ロジックの単体テスト。エミュレータ不要で速い
      - name: Unit test
        run: npm test

      # Firestore を読んで判定して書き戻す経路。エミュレータ上で実行する
      - name: Integration test
        run: npm run test:integration

      # デプロイされる形にビルドできることまで確かめる
      - name: Build
        run: npm run build

  rules:
    name: Security rules (Firestore & Storage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rules_test/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # devDependencies（firebase-tools等）除外・high/critical限定。
      # 詳細はfunctionsジョブの同名ステップのコメントを参照。
      - name: Dependency audit (high/critical only)
        run: npm audit --omit=dev --audit-level=high

      # ルールはアプリを経由しない直接アクセスに対する最後の砦なので、
      # 実装のテストとは独立に、毎回必ず検証する
      - name: Test rules
        run: npm test

  e2e:
    name: Integration test (Android emulator)
    # Androidエミュレータ上でアプリを本当に起動し、実際のタップ・画面遷移・
    # Firestoreへの読み書きを検証する。単体・ウィジェットテストでは通らない
    # 「main()の初期化」「GoRouterのリダイレクト」「実機のレイアウト」を守る層。
    #
    # Firebaseは本番ではなくローカルのエミュレータへ繋ぐため、テストが本番の
    # Firestore・認証・ユーザーデータを壊すことはない。
    # エミュレータの起動込みで15〜25分かかる。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # JDKを2つ入れる。AndroidのGradleビルドは17（release-stg.ymlと揃える）、
      # firebase-toolsはJDK21以上を要求するためエミュレータ起動だけ21を使う。
      # 複数指定した場合JAVA_HOMEは最後の版を指すので、17を後ろに置いている。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # firebase_options.dart / google-services.json は公開リポジトリに含めず
      # Secretsから復元する。google-services.json はAndroidのビルド自体に必要。
      - name: Restore Firebase config
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - run: flutter pub get

      # Androidエミュレータからは 10.0.2.2 でこのホストへ到達できる
      - name: Start Firebase emulators
        run: |
          # firebase-toolsはJDK21以上を要求する（17のままだと起動せずに落ちる）
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          npm install -g firebase-tools
          firebase emulators:start --only auth,firestore,storage --project aimaru-7eb2e \
            > "${RUNNER_TEMP}/firebase-emulator.log" 2>&1 &
          emulator_pid=$!

          for _ in $(seq 1 60); do
            # 起動に失敗して即死した場合、待ち続けず即座に失敗させる
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Firebaseエミュレータのプロセスが終了しました"
              cat "${RUNNER_TEMP}/firebase-emulator.log"
              exit 1
            fi
            if nc -z 127.0.0.1 8080 && nc -z 127.0.0.1 9099; then
              echo "Firebaseエミュレータ起動完了"
              exit 0
            fi
            sleep 2
          done
          echo "Firebaseエミュレータが起動しませんでした"
          cat "${RUNNER_TEMP}/firebase-emulator.log"
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVDをキャッシュして毎回の作成時間（数分）を省く
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google-apis-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVDのスナップショットを作成しました"

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # アニメーションを切るとpumpAndSettleが安定し、テストのフレークが減る
          disable-animations: true
          # このactionのscriptは1行ずつ別々の `sh -c` で実行されるため、
          # バックスラッシュによる行継続は使えない（継続のつもりの `\` が
          # そのまま引数として渡り、テスト対象の解決に失敗する）。1行で書くこと。
          script: flutter test integration_test --dart-define=USE_FIREBASE_EMULATOR=true --reporter expanded

      # 失敗時の原因調査用。Firestoreへの接続が拒否されている等がここで分かる
      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-log
          path: ${{ runner.temp }}/firebase-emulator.log
          if-no-files-found: ignore
