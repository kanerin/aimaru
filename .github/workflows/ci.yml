name: CI

# 変更が既存の挙動を壊していないことを機械的に確かめるためのワークフロー。
# AIエージェントによる自律開発は「壊れたことに気づける仕組み」が前提になるため、
# このワークフローをPRの必須チェックに設定すること
# （Settings → Branches → develop → Require status checks to pass）。
#
# 3つのジョブに分けているのは、落ちた場所から原因が一目で分かるようにするため。
# 1本にまとめると「CIが赤い」しか分からず、切り分けに時間を取られる。

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  # 同じブランチへ連続でpushしたとき、古い実行を止めて最新だけを走らせる
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # 単体・ウィジェットテスト。結合テスト(integration_test/)は実機が要るため
      # ここでは走らせない。
      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  functions:
    name: Cloud Functions (typecheck, unit & integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Firestore エミュレータは JVM 上で動く
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # テストコードも含めて型を通す（デプロイ成果物からは除外される）
      - name: Typecheck
        run: npm run typecheck

      # 判定ロジックの単体テスト。エミュレータ不要で速い
      - name: Unit test
        run: npm test

      # Firestore を読んで判定して書き戻す経路。エミュレータ上で実行する
      - name: Integration test
        run: npm run test:integration

      # デプロイされる形にビルドできることまで確かめる
      - name: Build
        run: npm run build

  rules:
    name: Security rules (Firestore & Storage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rules_test/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # ルールはアプリを経由しない直接アクセスに対する最後の砦なので、
      # 実装のテストとは独立に、毎回必ず検証する
      - name: Test rules
        run: npm test
