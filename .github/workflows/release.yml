name: Publish to Play Store (release-prd)

on:
  push:
    branches: [release-prd]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - run: flutter pub get

      # firebase_options.dart / google-services.json は公開リポジトリに含めず
      # Secrets から復元する（README「Firebase設定ファイルの非公開化」参照）
      - name: Restore Firebase config files
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # Play Storeはアップロードのたびに versionCode の単調増加を要求するため、
      # CI実行番号をそのままビルド番号に使う。
      - name: Build release App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # デフォルトはinternalトラック（審査なし・即時反映）。
      # 本番(production)トラックへ出す場合は track を変更するか、
      # Play Consoleで internal → production へ手動プロモートする。
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.aimaru
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
