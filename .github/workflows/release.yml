name: Publish to Play Store (release-prd)

on:
  push:
    branches: [release-prd]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 公開するバージョンを v* タグから決めるため

      # release-stg でテスターに配布した時に打った v* タグが、この
      # コミットのバージョン。Play Storeにも同じ番号で出す（stgで
      # 1.3.0 を確認したのにストアには 1.0.0 が並ぶ、という食い違いを防ぐ）。
      # タグが無い＝stgを経ずに来た場合だけ pubspec.yaml の値を使う。
      - name: Resolve version
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
            echo "v* タグが見つかりません。pubspec.yaml の $VERSION を使います" >&2
          fi
          echo "公開バージョン: $VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - run: flutter pub get

      # firebase_options.dart / google-services.json は公開リポジトリに含めず
      # Secrets から復元する（README「Firebase設定ファイルの非公開化」参照）
      - name: Restore Firebase config files
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # Play Storeはアップロードのたびに versionCode の単調増加を要求するため、
      # CI実行番号をそのままビルド番号に使う。
      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number=${{ github.run_number }} \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # デフォルトはinternalトラック（審査なし・即時反映）。
      # 本番(production)トラックへ出す場合は track を変更するか、
      # Play Consoleで internal → production へ手動プロモートする。
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.aimaru
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
