name: Reduce technical debt (1x/day)

# docs/open-issues.md のP0/P1のうちコード変更だけで完結するものを1つ選んで実装し、
# developへPRを作成してauto-mergeする。propose-feature.yml（機能追加枠）は
# 「Firebase設定・シークレット・課金構成に関わる変更を避ける」方針のため、
# そこに該当するP0/P1課題がいつまでも選ばれない問題への対応。
# developへの反映後、release-stgへのfast-forward昇格は promote-to-stg.yml が
# CI成功をトリガーに自動で行う（このワークフロー自身はrelease-stgに触れない）。
#
# 人間レビューを介さない自動実装のため、安全装置はCIのみ。
# ユーザーデータの削除・退会・ペア解消のような不可逆な変更は
# .claude/commands/reduce-debt.md の指示で対象外にしている。

on:
  schedule:
    - cron: '0 0 * * *' # 毎日 00:00 UTC = 09:00 JST
  workflow_dispatch: {}

# workflow_dispatchでの手動実行とcronが重なった場合に多重起動しないようにする
concurrency:
  group: reduce-debt
  cancel-in-progress: false

jobs:
  reduce-debt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # claude-code-action がOIDCトークン取得に使う
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # firebase_options.dart は公開リポジトリに含めていないため、
      # flutter test の実行（main.dart がimportしている）にはSecretsからの復元が要る
      - name: Restore firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Configure git identity for automated commits
        run: |
          git config user.name "aimaru-bot"
          git config user.email "actions@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            .claude/commands/reduce-debt.md の指示を読み、その通りに実行してください。
          display_report: true
          claude_args: --max-turns 150 --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git *),Bash(flutter *),Bash(npm *),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh pr list:*),Bash(gh pr view:*)"
